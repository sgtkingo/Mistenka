<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrola místenky · Petrůvka 1 A</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Místenka, domů"><span class="brand-mark" aria-hidden="true">⌁</span><span>Místenka</span></a>
    <nav class="main-nav" aria-label="Hlavní navigace"><a href="./">Revír</a><a href="./#jak-to-funguje">Jak to funguje</a><a href="./#kontakt">Kontakt</a></nav>
    <a class="login-button" href="./">Zpět na revír <span aria-hidden="true">↗</span></a>
  </header>
  <main class="status-page">
    <section class="panel-card status-shell">
      <div class="panel-heading"><div><span class="section-kicker">Kontrola</span><h1>Stav místenky</h1></div><span class="step-badge">RS příprava</span></div>
      <div id="statusLoading" class="status-loading">Ověřuji místenku…</div>
      <div id="statusContent" class="hidden">
        <div id="statusBanner" class="status-banner"></div>
        <div id="ticketStatusCard" class="ticket-status-card"></div>
      </div>
      <div id="statusError" class="hidden status-error"></div>
      <div class="quick-check">
        <span class="section-kicker">Rychlá akce</span>
        <h2>Ověřit další místenku</h2>
        <div class="code-row"><input id="nextCode" class="code-input" maxlength="6" placeholder="S7K4P2" autocomplete="off"><button class="primary-button" id="nextCheck" type="button">Ověřit kód</button></div>
      </div>
      <a class="back-button status-back" href="./">← Zpět na revír</a>
    </section>
  </main>
  <script src="status.js"></script>
</body>
</html>
