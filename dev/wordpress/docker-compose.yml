# Lokální WordPress pro vývoj a testy pluginu Místenka – stejné verze jako produkce (WP 7.1.4, PHP 8.3).
#   docker compose up -d && sh setup.sh        → http://localhost:8088 (aplikace), /wp-admin (admin / admin)
#   node test/api.test.js --base "http://localhost:8088/?rest_route=/mistenka/v1"
# Plugin, frontend i testovací konfigurace jsou přimountované přímo z repozitáře (změny platí hned).
name: mistenka-wp
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1.4-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('MISTENKA_APP_URL', 'http://localhost:8088');
        define('MISTENKA_CONFIG', '/mistenka/test/fixtures/organization.test.json');
        define('MISTENKA_FRONTEND_DIR', '/mistenka/src/frontend');
        define('MISTENKA_DATA_DIR', '/var/www/mistenka-data');
        define('MISTENKA_MAIL_TRANSPORT', 'file');
        define('MISTENKA_DEV', true);
        define('MISTENKA_RATE_LIMIT', false);
        define('MISTENKA_CRON_KEY', 'dev-cron-key');
        defined('WP_DEBUG') || define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes: &wp-volumes
      - wp:/var/www/html
      - ../../src/wordpress-plugin/mistenka:/var/www/html/wp-content/plugins/mistenka
      - ../../src:/mistenka/src:ro
      - ../../config:/mistenka/config:ro
      - ../../test:/mistenka/test:ro
      - data:/var/www/mistenka-data

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on: [wordpress]
    environment: *wp-env
    volumes: *wp-volumes

volumes:
  db:
  wp:
  data:
